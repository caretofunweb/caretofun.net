<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive PDF Novel Reader</title>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    /* Top / Status bar */
    .top-bar {
      height: 48px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .book-title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }

    .top-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Flipbook Workspace */
    .viewport {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    #flipbook {
      display: none;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.05);
    }

    .page canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .page-number {
      position: absolute;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
    }

    /* Hard cover styling */
    .page.--cover {
      background: #0f172a;
      color: #f8fafc;
    }

    /* Loading state */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(6px);
      z-index: 20;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Bottom Control Bar */
    .control-bar {
      height: 56px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 20px;
      z-index: 10;
    }

    .nav-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .nav-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .nav-btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .page-input {
      width: 50px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
    }

    .page-input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    /* Side navigation arrow overlays */
    .side-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 70px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 5;
    }

    .side-nav:hover {
      background: rgba(37, 99, 235, 0.85);
      color: #ffffff;
    }

    .side-nav.prev { left: 15px; }
    .side-nav.next { right: 15px; }

    @media (max-width: 640px) {
      .book-title { display: none; }
      .side-nav { display: none; }
      .viewport { padding: 5px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="book-title" id="bookTitle">📖 Reading Novel</div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSound" title="Toggle Sound">🔊 Sound</button>
      <button class="icon-btn" id="btnFullscreen" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </div>

  <!-- Main Flipbook Viewport -->
  <div class="viewport" id="viewport">
    <div class="side-nav prev" id="sidePrev" title="Previous Page">❮</div>
    <div id="flipbook"></div>
    <div class="side-nav next" id="sideNext" title="Next Page">❯</div>

    <!-- Loading Indicator -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText" style="font-weight: 500; font-size: 15px;">Loading Novel Pages...</div>
      <div id="loadingProgress" style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Preparing pages</div>
    </div>
  </div>

  <!-- Bottom Navigation Control Bar -->
  <div class="control-bar">
    <button class="nav-btn" id="btnPrev" disabled>◀ Previous</button>
    <div class="page-indicator">
      <span>Page</span>
      <input type="number" id="pageInput" class="page-input" min="1" value="1" />
      <span>of <span id="totalPages">--</span></span>
    </div>
    <button class="nav-btn" id="btnNext" disabled>Next ▶</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file') || urlParams.get('pdf') || '/pdfs/sample-novel.pdf';
    const customTitle = urlParams.get('title');

    if (customTitle) {
      document.getElementById('bookTitle').innerText = '📖 ' + customTitle;
      document.title = customTitle + ' — PDF Reader';
    }

    const flipbookEl = document.getElementById('flipbook');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingProgress = document.getElementById('loadingProgress');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const sidePrev = document.getElementById('sidePrev');
    const sideNext = document.getElementById('sideNext');
    const pageInput = document.getElementById('pageInput');
    const totalPagesSpan = document.getElementById('totalPages');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const btnSound = document.getElementById('btnSound');

    let pageFlip = null;
    let totalPdfPages = 0;
    let soundEnabled = true;

    // Simple audio synthesizer for subtle page-turning sound
    function playTurnSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch (e) {}
    }

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      btnSound.innerText = soundEnabled ? '🔊 Sound' : '🔇 Mute';
    });

    async function loadPdfAndRenderFlipbook() {
      try {
        loadingText.innerText = 'Downloading PDF Document...';
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        totalPdfPages = pdf.numPages;
        totalPagesSpan.innerText = totalPdfPages;
        pageInput.max = totalPdfPages;

        loadingText.innerText = 'Rendering Digital Book Pages...';

        // Base dimensions (typical novel aspect ratio ~1:1.4)
        const viewportWidth = window.innerWidth;
        const isMobile = viewportWidth < 768;
        const pageWidth = isMobile ? Math.min(viewportWidth - 30, 420) : 480;
        const pageHeight = Math.round(pageWidth * 1.4);

        for (let pageNum = 1; pageNum <= totalPdfPages; pageNum++) {
          loadingProgress.innerText = `Processing page ${pageNum} of ${totalPdfPages}...`;
          const page = await pdf.getPage(pageNum);

          // Render high-res on canvas
          const unscaledViewport = page.getViewport({ scale: 1 });
          const scale = (pageWidth * 2) / unscaledViewport.width; // 2x for sharp retina text
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page' + (pageNum === 1 ? ' --cover' : '');
          pageDiv.appendChild(canvas);

          const pageNumEl = document.createElement('div');
          pageNumEl.className = 'page-number';
          pageNumEl.innerText = pageNum;
          pageDiv.appendChild(pageNumEl);

          flipbookEl.appendChild(pageDiv);
        }

        // Initialize PageFlip
        flipbookEl.style.display = 'block';
        loadingOverlay.style.display = 'none';

        pageFlip = new St.PageFlip(flipbookEl, {
          width: pageWidth,
          height: pageHeight,
          size: 'stretch',
          minWidth: 280,
          maxWidth: 900,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: true,
          usePortrait: isMobile,
          flippingTime: 700
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        // Listeners for page turns
        pageFlip.on('flip', (e) => {
          const currentPageIndex = e.data; // 0-indexed
          const displayPage = currentPageIndex + 1;
          pageInput.value = displayPage;
          updateNavButtons(currentPageIndex);
          playTurnSound();
        });

        updateNavButtons(0);

      } catch (err) {
        console.error('Error loading PDF:', err);
        loadingText.innerText = 'Failed to load PDF document.';
        loadingProgress.innerText = err.message || 'Check if the file URL is correct.';
      }
    }

    function updateNavButtons(currentIndex) {
      btnPrev.disabled = currentIndex <= 0;
      sidePrev.style.opacity = currentIndex <= 0 ? '0.2' : '1';

      btnNext.disabled = currentIndex >= totalPdfPages - 1;
      sideNext.style.opacity = currentIndex >= totalPdfPages - 1 ? '0.2' : '1';
    }

    // Previous / Next actions
    function prevPage() {
      if (pageFlip && !btnPrev.disabled) pageFlip.flipPrev();
    }
    function nextPage() {
      if (pageFlip && !btnNext.disabled) pageFlip.flipNext();
    }

    btnPrev.addEventListener('click', prevPage);
    btnNext.addEventListener('click', nextPage);
    sidePrev.addEventListener('click', prevPage);
    sideNext.addEventListener('click', nextPage);

    // Jump to page
    pageInput.addEventListener('change', (e) => {
      let val = parseInt(e.target.value, 10);
      if (isNaN(val)) val = 1;
      if (val < 1) val = 1;
      if (val > totalPdfPages) val = totalPdfPages;
      e.target.value = val;
      if (pageFlip) pageFlip.flip(val - 1);
    });

    // Keyboard navigation (Arrow keys)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowRight') nextPage();
    });

    // Fullscreen toggle
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        btnFullscreen.innerText = '✕ Exit Fullscreen';
      } else {
        document.exitFullscreen().catch(() => {});
        btnFullscreen.innerText = '⛶ Fullscreen';
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        btnFullscreen.innerText = '⛶ Fullscreen';
      }
    });

    // Start loading
    loadPdfAndRenderFlipbook();
  </script>
</body>
</html>
